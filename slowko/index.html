<style>
/* moj-wyglad · baza.css — wklejaj na początek <style> każdego projektu.

:root{

  --fg:#eceef2; --muted:#8b919c; --faint:#5b616c;
  --accent:#9aa8ff; --accent-fg:#0b1030; --accent-soft:rgba(154,168,255,.14);
  --good:#5fe0b5; --good-soft:rgba(95,224,181,.12); --bad:#ff7b7b; --bad-soft:rgba(255,123,123,.12); --warn:#f2c14e;
  --shadow:0 0 0 1px var(--line);
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#eef0f4; --line:rgba(16,24,40,.07); --line2:rgba(16,24,40,.13);
  --fg:#111622; --muted:#667085; --faint:#a3a9b4;
  --accent:#4457d6; --accent-fg:#ffffff; --accent-soft:rgba(68,87,214,.10);
  --good:#0d9a72; --good-soft:rgba(13,154,114,.10); --bad:#d64545; --bad-soft:rgba(214,69,69,.10); --warn:#b47f06;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 1px var(--line);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#eef0f4; --line:rgba(16,24,40,.07); --line2:rgba(16,24,40,.13);
  --fg:#111622; --muted:#667085; --faint:#a3a9b4;
  --accent:#4457d6; --accent-fg:#ffffff; --accent-soft:rgba(68,87,214,.10);
  --good:#0d9a72; --good-soft:rgba(13,154,114,.10); --bad:#d64545; --bad-soft:rgba(214,69,69,.10); --warn:#b47f06;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 1px var(--line);
  color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Nagłówek strony: tytuł po lewej, mała plakietka po prawej */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font:800 20px/1.2 var(--f);letter-spacing:-.02em;margin:0}
.top .sub{font-size:12.5px;color:var(--muted)}

/* Karta: tylko dla najważniejszego. Bez ramek – cień 1px */
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
/* Sekcja drugorzędna: wprost na tle, tylko linia u góry */
.sec{border-top:1px solid var(--line);padding-top:16px}

/* Typografia: rozmiar = ważność */
.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}            /* mały podpis, bez WERSALIKÓW */
.big{font:800 40px/1.05 var(--f);letter-spacing:-.04em;margin-top:6px;word-break:break-word} /* główna liczba / słowo, kolor --fg */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)} /* JEDNA linia: a · b · c */
.stats b{color:var(--fg);font-weight:700}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:12.5px}
h2{font:700 15px/1.3 var(--f);margin:0}

/* Przyciski */
button,.btn{font:600 13.5px var(--f);border:0;background:var(--surface2);color:var(--fg);border-radius:12px;padding:0 16px;height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{filter:brightness(1.12)}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg)}   /* JEDEN na widok */
button.ghost{background:transparent;color:var(--muted)}
button.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* Przełącznik (segmenty) – zamiast rzędu „pigułek” z ramkami */
.seg{display:inline-flex;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:transparent;color:var(--muted);height:32px;border-radius:9px;padding:0 12px;font-size:12.5px;flex:none}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* Lista rozwijana zamiast rzędów przycisków (ustawienia, kategorie) */
select{font:500 13.5px var(--f);color:var(--fg);background:var(--surface2);border:0;border-radius:10px;height:36px;padding:0 12px;max-width:100%}

/* Plakietka statusu */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* Wiersze listy: etykieta | wartość | strzałka; szczegóły po dotknięciu */
.rows{display:flex;flex-direction:column}
.rows>*{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.rows>*:first-child{border-top:0}

/* Zwijane sekcje – domyślnie ZWINIĘTE */
details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}

/* Telefon: przestronnie, nie ściśnięte */
@media (max-width:480px){.card{padding:16px}.big{font-size:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* Symetria: wszystko wyśrodkowane, jak „Wyśrodkuj” w Wordzie */
.wrap{text-align:center}
.top{flex-direction:column;justify-content:center;align-items:center;gap:8px}
.row,.stats,.head2{justify-content:center}
.seg{align-self:center}
details>summary{justify-content:center}
.rows>*{text-align:left}            /* wiersz „nazwa | wartość” zostaje rozłożony na boki – też symetryczny */
.opt{justify-content:center;text-align:center}
.list li{text-align:left}
.mini{align-items:center}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
/* Słówko dnia – klasy projektu, tylko na zmiennych bazy */
.eyebrow{font-size:12.5px;font-weight:600;color:var(--muted)}
.word{font:800 40px/1.05 var(--f);letter-spacing:-.04em;margin-top:6px;word-break:break-word}
.pos{font-size:12.5px;color:var(--faint);margin-top:4px}
.def{font-size:16px;margin:14px 0 0}
.ex{margin:8px 0 0;color:var(--muted)}
.swap{margin-top:14px;font-size:13px;color:var(--muted)} .swap b{color:var(--fg)}
.row{margin-top:18px}
.row button.on{background:var(--surface2);color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mini{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.mini p{margin:4px 0 0}
.from{color:var(--faint);text-decoration:line-through}
.opt{display:flex;width:100%;justify-content:flex-start;text-align:left;height:auto;min-height:44px;padding:11px 14px;margin-top:8px;font-weight:500;line-height:1.4}
.opt.good{background:var(--good-soft);color:var(--good)}
.opt.wrong{background:var(--bad-soft);color:var(--bad)}
.score{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.head2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.list{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.list li:first-child{border-top:0}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted);flex:none}
.chip.k{background:var(--good-soft);color:var(--good)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
#panel>details{margin-top:20px}
#panel .def{margin-top:10px}
</style>

["Kultura","Najważniejsze dzieła Szekspira?","M.in. „Hamlet”, „Romeo i Julia”, „Makbet”, „Król Lear”."],
["Kultura","Co to jest „Oda do radości”?","Finał IX Symfonii Beethovena – dziś hymn Unii Europejskiej."],
["Kultura","Trzej najważniejsi filozofowie greccy?","Sokrates, jego uczeń Platon i uczeń Platona – Arystoteles."],
["Kultura","Co to jest trójpodział władzy?","Rozdzielenie władzy na ustawodawczą, wykonawczą i sądowniczą (Monteskiusz, XVIII w.)."],
["Pieniądze","Co to jest inflacja?","Wzrost cen – za te same pieniądze kupujesz mniej."],
["Pieniądze","Co to jest PKB?","Wartość wszystkich towarów i usług wytworzonych w kraju w ciągu roku."],
["Pieniądze","Co to jest procent składany?","Odsetki naliczane także od wcześniejszych odsetek – dlatego długie oszczędzanie rośnie coraz szybciej."],
["Pieniądze","Po co bank centralny podnosi stopy procentowe?","Żeby kredyty podrożały, ludzie mniej wydawali i inflacja spadła."]
];
// tematy do dalszej nauki
const T=["Mitologia grecka (Zeus, Odyseja, puszka Pandory)","Biblia jako źródło frazeologii (hiob, judaszowe srebrniki)","Łacińskie sentencje (carpe diem, memento mori)","Wielcy malarze i style (barok, impresjonizm)","Muzyka klasyczna (Bach, Mozart, Beethoven, Chopin)","Kanon lektur (Kochanowski, Mickiewicz, Sienkiewicz, Prus)","Ustrój Polski i UE w praktyce","Podstawy ekonomii i finansów osobistych","Mapa świata: stolice i państwa","Najważniejsze wynalazki (prąd, penicylina, internet)","Błędy logiczne w dyskusji (ad hominem, chochoł)","Związki frazeologiczne (syzyfowa praca, pięta achillesowa)"];

// ---------- STAN ----------
const KEY="slowko-v1";
let S={seen:{},known:{},kn:{},days:[],quiz:{ok:0,all:0}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

// ---------- DZIEŃ ----------
const now=new Date();
const dayNo=Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function order(n,seed){const a=[...Array(n).keys()],r=rng(seed);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const oW=order(W.length,7),oU=order(U.length,11),oF=order(F.length,13),oK=order(K.length,17);
const pick=(o,k)=>o[((k%o.length)+o.length)%o.length];
const wi=pick(oW,dayNo),ui=pick(oU,dayNo),fi=pick(oF,dayNo),ki=pick(oK,dayNo);

// streak
if(!S.days.includes(dayNo)){S.days.push(dayNo);S.days=S.days.slice(-400)}
S.seen[W[wi][0]]=S.seen[W[wi][0]]||dayNo;save();
function streak(){let s=0,d=dayNo;const set=new Set(S.days);while(set.has(d)){s++;d--}return s}

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("date").textContent=now.toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"});
function head(){const s=streak(),n=Object.keys(S.seen).length;
  $("streak").textContent=`${s} ${s===1?"dzień":"dni"} z rzędu · ${n} ${n===1?"słowo":"słów"}`}
head();

function wordHTML(i,big){const w=W[i];return `
  <div class="eyebrow">${big?"Słowo dnia":"Słowo"}</div>
  <div class="word">${esc(w[0])}</div>
  <div class="pos">${esc(w[1])}</div>
  <p class="def">${esc(w[2])}</p>
  <p class="ex">${esc(w[3])}</p>
  ${w[4]?`<div class="swap">Zamiast „${esc(w[4])}” powiedz <b>${esc(w[0])}</b>.</div>`:""}`}

function renderToday(){
  const k=S.known[W[wi][0]];
  $("today").innerHTML=wordHTML(wi,true)+`
  <div class="row">
    <button class="${k?"on":""}" id="b-know">${k?"Umiem":"Umiem to słowo"}</button>
  </div>
  <details><summary>Na dziś: wiedza, zwrot, ciekawostka</summary>
    <div class="mini">
      <div><div class="eyebrow">Warto wiedzieć · ${esc(K[ki][0])}</div>
        <p style="margin-top:6px"><b>${esc(K[ki][1])}</b></p><p class="muted">${esc(K[ki][2])}</p></div>
      <div><div class="eyebrow">Upgrade wypowiedzi</div>
        <p style="margin-top:6px"><span class="from">${esc(U[ui][0])}</span> → <b>${esc(U[ui][1])}</b></p>
        <p class="muted">${esc(U[ui][2])}</p></div>
      <div><div class="eyebrow">Ciekawostka</div><p style="margin-top:6px">${esc(F[fi])}</p></div>
    </div>
  </details>`;
  $("b-know").onclick=()=>{const n=W[wi][0];if(S.known[n])delete S.known[n];else S.known[n]=dayNo;save();renderToday();if(tab==="moje")renderPanel()};
}
renderToday();

// ---------- ZAKŁADKI ----------
let tab="losuj",roll={kind:"know",i:ki},Q=null,kc="Wszystko",kq={i:-1,show:false};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  if(tab==="quiz"&&!Q)newQ();renderPanel()});

const rnd=n=>Math.floor(Math.random()*n);
function doRoll(kind){
  if(kind==="any")kind=["word","fact","upgrade","know"][rnd(4)];
  const len={word:W.length,fact:F.length,upgrade:U.length,know:K.length}[kind];
  let i=rnd(len);if(roll.kind===kind&&len>1&&i===roll.i)i=(i+1)%len;
  roll={kind,i};if(kind==="word"){S.seen[W[i][0]]=S.seen[W[i][0]]||dayNo;save();head()}renderPanel()}

function newQ(){
  const pool=Object.keys(S.seen).map(n=>W.findIndex(w=>w[0]===n)).filter(i=>i>=0);
  const src=pool.length>=4&&Math.random()<.6?pool:[...W.keys()];
  const a=src[rnd(src.length)];const opts=new Set([a]);
  while(opts.size<4)opts.add(rnd(W.length));
  Q={a,opts:[...opts].sort(()=>Math.random()-.5),picked:null}}

function renderPanel(){
  const p=$("panel");
  if(tab==="losuj"){
    let body="";
    if(roll.kind==="word")body=wordHTML(roll.i,false);
    else if(roll.kind==="know")body=`<div class="eyebrow">Warto wiedzieć · ${esc(K[roll.i][0])}</div><p class="def"><b>${esc(K[roll.i][1])}</b></p><p class="ex">${esc(K[roll.i][2])}</p>`;
    else if(roll.kind==="fact")body=`<div class="eyebrow">Ciekawostka</div><p class="def">${esc(F[roll.i])}</p>`;
    else{const u=U[roll.i];body=`<div class="eyebrow">Upgrade wypowiedzi</div>
      <p class="def"><span class="from">${esc(u[0])}</span><br>→ <b>${esc(u[1])}</b></p><p class="muted">${esc(u[2])}</p>`}
    p.innerHTML=body+`<div class="row"><button class="primary" id="r-any">Losuj coś</button></div>
      <div class="grid">
      <button id="r-word">Słowo</button><button id="r-know">Wiedza</button><button id="r-upgrade">Zwrot</button><button id="r-fact">Ciekawostka</button></div>`;
    $("r-any").onclick=()=>doRoll("any");$("r-word").onclick=()=>doRoll("word");
    $("r-upgrade").onclick=()=>doRoll("upgrade");$("r-know").onclick=()=>doRoll("know");$("r-fact").onclick=()=>doRoll("fact");
  }
  if(tab==="wiedza"){
    const cats=["Wszystko",...new Set(K.map(k=>k[0]))];
    const pool=K.map((k,i)=>i).filter(i=>kc==="Wszystko"||K[i][0]===kc);
    if(!pool.includes(kq.i))kq={i:pool[rnd(pool.length)],show:false};
    const k=K[kq.i],done=Object.keys(S.kn).length;
    p.innerHTML=`<div class="head2"><select id="kc" aria-label="Kategoria">${cats.map(c=>`<option ${c===kc?"selected":""}>${esc(c)}</option>`).join("")}</select><span class="score">umiem ${done}/${K.length}</span></div>
      <div class="eyebrow" style="margin-top:16px">${esc(k[0])}</div>
      <p class="def"><b>${esc(k[1])}</b></p>
      ${kq.show?`<p class="ex">${esc(k[2])}</p>`:""}
      <div class="row">${kq.show?`<button class="primary" id="k-ok">Wiedziałem</button><button id="k-no">Nie wiedziałem</button>`:`<button class="primary" id="k-show">Pokaż odpowiedź</button><button id="k-skip">Pomiń</button>`}</div>
      <details><summary>Co jeszcze warto poznać</summary><ul class="list">${T.map(t=>`<li style="cursor:default">${esc(t)}</li>`).join("")}</ul></details>`;
    $("kc").onchange=e=>{kc=e.target.value;kq={i:-1};renderPanel()};
    const next=()=>{const others=pool.filter(i=>i!==kq.i&&!S.kn[i]);const src=others.length?others:pool;kq={i:src[rnd(src.length)],show:false};renderPanel()};
    if($("k-show"))$("k-show").onclick=()=>{kq.show=true;renderPanel()};
    if($("k-skip"))$("k-skip").onclick=next;
    if($("k-ok"))$("k-ok").onclick=()=>{S.kn[kq.i]=dayNo;save();next()};
    if($("k-no"))$("k-no").onclick=()=>{delete S.kn[kq.i];save();next()};
  }
  if(tab==="quiz"){
    const q=Q,pct=S.quiz.all?Math.round(100*S.quiz.ok/S.quiz.all):0;
    p.innerHTML=`<div class="head2">
      <span class="eyebrow">Co znaczy to słowo?</span><span class="score">${S.quiz.ok}/${S.quiz.all} · ${pct}%</span></div>
      <div class="word" style="font-size:clamp(28px,7vw,38px)">${esc(W[q.a][0])}</div>
      ${q.opts.map((o,k)=>`<button class="opt ${q.picked===null?"":o===q.a?"good":o===q.picked?"wrong":""}" data-o="${o}" id="q-${k}">${esc(W[o][2])}</button>`).join("")}
      ${q.picked!==null?`<p class="ex">${esc(W[q.a][3])}</p><div class="row"><button class="primary" id="q-next">Następne</button></div>`:""}`;
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(Q.picked!==null)return;Q.picked=+b.dataset.o;
      S.quiz.all++;if(Q.picked===Q.a){S.quiz.ok++;S.seen[W[Q.a][0]]=S.seen[W[Q.a][0]]||dayNo}save();head();renderPanel()});
    if($("q-next"))$("q-next").onclick=()=>{newQ();renderPanel()};
  }
  if(tab==="moje"){
    const names=Object.keys(S.seen).sort((a,b)=>S.seen[b]-S.seen[a]);
    const known=names.filter(n=>S.known[n]).length;
    p.innerHTML=`<div class="head2">
      <span class="eyebrow">Poznane słowa</span><span class="score">${known} umiem · ${names.length-known} do powtórki</span></div>
      <ul class="list">${names.map(n=>{const i=W.findIndex(w=>w[0]===n);return `<li data-i="${i}"><span><span style="min-width:0"><b>${esc(n)}</b><br><span class="faint">${esc(W[i][2])}</span></span></span><span class="chip ${S.known[n]?"k":""}">${S.known[n]?"umiem":"powtórz"}</span></li>`}).join("")}</ul>
      <p class="faint" style="margin-top:12px">Kliknij słowo, żeby oznaczyć je jako opanowane. Postęp zapisuje się na tym urządzeniu.</p>`;
    p.querySelectorAll("li").forEach(li=>li.onclick=()=>{const n=W[+li.dataset.i][0];
      if(S.known[n])delete S.known[n];else S.known[n]=dayNo;save();renderPanel();renderToday()});
  }
}
renderPanel();
</script>
